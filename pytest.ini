[pytest]
# ============================================================================
# H3-Studio 测试集治理配置（2026-11-22 立项）
#
# 【用户原话】
#   「pytest tests/ -q 这个测试集里的内容，太过老旧不说，内容还特别多，
#     浪费非常大的时间。」
#
# 【本文件解决什么】
#   1. **默认集瘦身**：裸跑 `pytest tests/ -q` 只跑「快且有效」的子集
#      （marker `fast`），slow / e2e / live 默认 skip 并打印原因；
#   2. **legacy 不收集**：`legacy` 的用例文件保留在仓库里但**默认不收集**
#      （`--ignore` 列表见 conftest.py 的 `LEGACY_TEST_FILES`）；
#   3. **护栏**：任何指向线上 8190 / 8188 或线上 jobs.db 的用例一律
#      fail-fast（见 conftest.py 的 `_guard_live_endpoints`）。
#
# 【怎么跑】
#   pytest tests/ -q                 # 默认：只跑 fast 子集（数分钟内）
#   pytest tests/ -q -m "not slow"    # 显式：fast + 非 slow（即默认集）
#   pytest tests/ -q -m slow         # 慢用例（真实生成 / 端到端）
#   pytest tests/ -q -m e2e          # 浏览器端到端
#   pytest tests/ -q -m live         # 依赖线上服务的用例（需显式开闸）
#   pytest tests/ -q -m legacy       # 已废弃用例（默认不收集，需显式指定）
#   pytest tests/ -q --run-live      # 打开「允许打线上」的总闸
#
# 【重要】默认的 `addopts` **不**排除 slow/e2e/live —— 排除是**在
# conftest.py 里用 skip 标记**实现的（`pytest_collection_modifyitems`），
# 这样即使有人直接 `pytest tests/test_xxx.py::test_yyy` 跑单条用例，
# 也仍然受护栏保护，不会误打线上。
# ============================================================================

testpaths = tests

# 只收集 test_*.py / *_test.py（默认行为，显式写出便于阅读）
python_files = test_*.py *_test.py

# 不把 warnings 当错误（仓库里有一批历史 warning，见 evidence 报告）
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::SyntaxWarning

# 【为什么关掉 cacheprovider】
# 测试在隔离 worktree 里跑，.pytest_cache 写进工作树会污染 git status。
# 需要缓存时用 `-p no:cacheprovider` 反过来（默认就是关的，这里写明）。
addopts = -p no:cacheprovider --strict-markers

markers =
    fast: 快且有效的用例（默认集，秒级）
    slow: 慢用例（真实生成 / 重 IO / 长等待），默认 skip
    e2e: 真实浏览器端到端用例，默认 skip
    live: 依赖线上服务 / 线上数据目录的用例，默认 skip
    legacy: 已过时或与现状实现不符的用例，默认不收集
    guard: 测试集治理护栏自身的自测用例
