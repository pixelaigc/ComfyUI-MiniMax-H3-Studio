<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H3 Studio — 本地视频生成工作台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">H3</span>
    <span class="brand-name">MiniMax-H3 Studio</span>
  </div>
  <div class="top-status" id="topStatus">
    <span class="dot dot-ok"></span><span id="statusText">空闲</span>
  </div>
</header>

<div class="layout">
  <!-- 左侧导航 -->
  <nav class="sidebar">
    <div class="nav-label">CREATE</div>
    <div class="nav-group">视频</div>
    <a class="nav-item" data-mode="t2v">
      <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1.5" y="3" width="13" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 6l4 2.5-4 2.5z" fill="currentColor"/></svg>
      文生视频
    </a>
    <a class="nav-item" data-mode="flf">
      <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1" y="3" width="6" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="3" width="6" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 2v12" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 2"/></svg>
      首尾帧
    </a>
    <a class="nav-item" data-mode="r2v">
      <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="5" cy="6" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="11" cy="6" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 13.5c0-2 1.5-3 3-3s3 1 3 3M8 13.5c0-2 1.5-3 3-3s3 1 3 3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      参考生成
    </a>
    <div class="nav-group">图像</div>
    <a class="nav-item" data-mode="t2i">
      <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1.5" y="1.5" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5.5" cy="5.5" r="1.5" fill="currentColor"/><path d="M2.5 12l3.5-3.5 2.5 2.5 3-4 2 2.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      Z-IMAGE 文生图
    </a>
    <div class="nav-group">系统</div>
    <a class="nav-item" id="navSystem">
      <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1.5" y="2.5" width="13" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 13.5h6M8 10.5v3" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 7.5l2-2 1.5 2.5 2-3 2 2.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      硬件参数
    </a>
    <div class="sidebar-foot">
      <button id="unloadBtn" title="释放 GPU 显存">释放显存</button>
    </div>
  </nav>

  <!-- 参数面板 -->
  <aside class="panel" id="panel">
    <!-- 图片上传区（按模式显示） -->
    <div class="upload-zone" id="uploadZone" style="display:none">
      <div id="uploadTitle" class="upload-title">上传图片</div>
      <div class="upload-row" id="uploadRow"></div>
    </div>

    <div class="field">
      <div class="field-label">分辨率</div>
      <div class="seg" id="resSeg">
        <button data-v="544p"><b>544p</b><small>快速</small></button>
        <button data-v="768p" class="active"><b>768p</b><small>高清</small></button>
      </div>
    </div>

    <div class="field" id="modelField">
      <div class="field-label">模型 <span class="muted">基础模型随模式自动切换</span></div>
      <div class="cards2" id="modelCards">
        <button data-v="lora" class="active"><b>MiniMax-H3 + LoRA</b><small>Turbo 加速 · 4 步</small></button>
        <button data-v="standard"><b>标准 MiniMax-H3</b><small>20 步 · 质量优先</small></button>
      </div>
      <div class="subfield" id="loraField">
        <div class="field-label">LoRA 选择</div>
        <div class="cards2" id="loraCards">
          <button data-v="ckpt850"><b>Turbo ckpt850</b><small>4 步 · ema</small></button>
          <button data-v="v4step600" class="active"><b>v4-step600</b><small>4 步 · 推荐</small></button>
        </div>
        <div class="field-label" style="margin-top:10px">LoRA 强度 <span id="loraStrengthVal">1.00</span></div>
        <input type="range" id="loraStrength" min="0" max="1.5" step="0.05" value="1">
      </div>
    </div>

    <div class="field" id="stepsField">
      <div class="field-label">步数 <span id="stepsVal">4</span> <span class="muted">4~20，步多质量高但更慢</span></div>
      <input type="range" id="steps" min="4" max="20" step="1" value="4">
    </div>

    <div class="field">
      <div class="field-label">画面比例</div>
      <div class="chips" id="aspectChips">
        <button data-v="16:9">16:9</button>
        <button data-v="9:16">9:16</button>
        <button data-v="4:3">4:3</button>
        <button data-v="3:4">3:4</button>
        <button data-v="1:1">1:1</button>
      </div>
    </div>

    <div class="field" id="durField">
      <div class="field-label">时长 <span id="durVal">5s</span></div>
      <input type="range" id="duration" min="5" max="15" step="1" value="5">
    </div>

    <div class="field">
      <div class="field-label">提示词</div>
      <textarea id="prompt" rows="6" placeholder="描述画面…支持多镜头分镜写法"></textarea>
    </div>

    <div class="field">
      <div class="field-label">种子 <span class="muted">留空随机</span></div>
      <input type="text" id="seed" placeholder="随机">
    </div>

    <button class="gen-btn" id="genBtn">生成</button>
  </aside>

  <!-- 任务卡片区 -->
  <main class="jobs-area" id="jobsArea">
    <div class="jobs-head">
      <div class="jobs-tabs">
        <button class="active" data-st="active">进行中</button>
        <button data-st="done">已完成</button>
        <button data-st="failed">失败</button>
      </div>
    </div>
    <div class="jobs-grid" id="jobsGrid"></div>
  </main>

  <!-- 硬件参数页 -->
  <main class="system-page" id="systemPage" style="display:none">
    <div class="sys-head">
      <div>
        <div class="sys-title">本机硬件参数</div>
        <div class="sys-sub" id="sysSub">读取中…</div>
      </div>
      <button class="sys-refresh" id="sysRefresh">刷新</button>
    </div>
    <div class="sys-grid" id="sysGrid"></div>
  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
