<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelAIGC ComfyUI-MiniMax-H3 Studio v1.00</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css?v=topbar44">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">H3</span>
    <span class="brand-name"><strong>PixelAIGC ComfyUI-MiniMax-H3 Studio</strong> <span class="brand-version">v1.00</span></span>
    <span class="brand-links" aria-label="PixelAIGC 官方链接">

  </div>
  <div class="top-status" id="topStatus">
    <span class="dot dot-ok"></span><span id="statusText">空闲</span>
  </div>
</header>

<div class="layout">
  <!-- 左侧导航 -->
  <nav class="sidebar">
    <div class="nav-label">CREATE</div>
    <div class="nav-group">视频</div>
    <a class="nav-item" data-mode="t2v">
      <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1.5" y="3" width="13" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 6l4 2.5-4 2.5z" fill="currentColor"/></svg>
      文生视频
    </a>
    <a class="nav-item" data-mode="flf">
      <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1" y="3" width="6" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="3" width="6" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 2v12" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 2"/></svg>
      首尾帧
    </a>
    <a class="nav-item" data-mode="r2v">
      <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="5" cy="6" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="11" cy="6" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 13.5c0-2 1.5-3 3-3s3 1 3 3M8 13.5c0-2 1.5-3 3-3s3 1 3 3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      参考生成
    </a>
    <a class="nav-item" id="navStitch">
      <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1.5" y="3" width="5" height="10" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="9.5" y="3" width="5" height="10" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6.7 8h2.6M8 6.7V9.3" stroke="currentColor" stroke-width="1.3"/></svg>
      长片拼接
    </a>
    <div class="nav-group">图像</div>
    <a class="nav-item" data-mode="t2i">
      <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1.5" y="1.5" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5.5" cy="5.5" r="1.5" fill="currentColor"/><path d="M2.5 12l3.5-3.5 2.5 2.5 3-4 2 2.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      Z-IMAGE 文生图
    </a>
    <div class="nav-group">系统</div>
    <a class="nav-item" id="navSystem">
      <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1.5" y="2.5" width="13" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 13.5h6M8 10.5v3" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 7.5l2-2 1.5 2.5 2-3 2 2.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      硬件参数
    </a>
    <div class="sidebar-foot">
      <div class="sidebar-links" aria-label="PixelAIGC 官方链接">
        <a href="https://github.com/pixelaigc" target="_blank" rel="noopener noreferrer" aria-label="PixelAIGC GitHub" title="GitHub · pixelaigc">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.88c-2.78.6-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.64-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.55 9.55 0 0 1 12 6.82a9.55 9.55 0 0 1 2.5.34c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.86v2.76c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg>
        </a>
        <a href="https://pixelaigc.cc" target="_blank" rel="noopener noreferrer" aria-label="PixelAIGC 官网" title="pixelaigc.cc">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.3 2.47 3.5 5.47 3.5 9S14.3 18.53 12 21M12 3C9.7 5.47 8.5 8.47 8.5 12S9.7 18.53 12 21"/></svg>
        </a>
        <a href="https://x.com/pixelaigc" target="_blank" rel="noopener noreferrer" aria-label="PixelAIGC X" title="X · @pixelaigc">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4.2l3.6 5.1L17.2 4H19l-5.4 6.4L19.8 20h-4.2l-4-5.7L6.8 20H5l5.8-7L5 4Zm3.3 1.5 8.1 13h1.1l-8.1-13H8.3Z"/></svg>
        </a>
      </div>
      <button id="unloadBtn" title="释放 GPU 显存">释放显存</button>
    </div>
  </nav>

  <!-- 参数面板 -->
  <aside class="panel" id="panel">
    <div class="field">
      <div class="field-label">分辨率</div>
      <div class="seg" id="resSeg">
        <button data-v="544p" class="active"><b>544p</b><small>快速</small></button>
        <button data-v="768p"><b>768p</b><small>高清</small></button>
      </div>
    </div>

    <div class="field" id="durField">
      <div class="field-label">时长 <span id="durVal">5s</span></div>
      <input type="range" id="duration" min="5" max="15" step="1" value="5">
    </div>

    <div class="field">
      <div class="field-label">画面比例</div>
      <div class="chips" id="aspectChips">
        <button data-v="16:9" class="active">16:9</button>
        <button data-v="9:16">9:16</button>
        <button data-v="4:3">4:3</button>
        <button data-v="3:4">3:4</button>
        <button data-v="1:1">1:1</button>
      </div>
    </div>

    <div class="field">
      <div class="field-label">提示词</div>
      <textarea id="prompt" rows="6" placeholder="描述画面…支持多镜头分镜写法">integrated_multimodal_description: [Shot 1] Live-action, cinematic Chinese wuxia period film. At night in a moonlit bamboo forest, a tight close-up frames an adult swordsman in black robes (S1) from the white-robed swordsman’s shoulder, forming the first angle of a shot–reverse-shot sequence. Cold mist drifts behind him; his tied long hair moves slightly in the wind, and one hand rests on the hilt at his waist. The camera slowly pushes in with small amplitude as the black-robed swordsman, speaking in a low, restrained male voice, fixes his opponent with an unwavering stare and says: &lt;d&gt;[Chinese] 你终于来了。&lt;/d&gt; [Shot 2] At 00:02.300, the camera cuts to the exact reverse angle: a tight close-up of the adult white-robed swordsman (S2) over the black-robed swordsman’s shoulder. Moonlight traces the edge of his face while swaying bamboo shadows cross his calm expression. Without drawing his sword, the white-robed swordsman replies in a quiet, firm male voice: &lt;d&gt;[Chinese] 今夜，做个了断。&lt;/d&gt; His thumb slowly pushes the sword guard forward, exposing a narrow glint of steel before the video ends at 5.00 seconds.

overall_soundscape: Night wind rustles dense bamboo leaves while insects call faintly in the distance. Robe fabric shifts softly, followed by the subtle metallic scrape of a sword beginning to leave its scabbard.

non_diegetic_music: Sparse low guqin notes over a sustained bowed-string drone, ending on a single deep drumbeat as the blade is exposed.</textarea>
    </div>

    <button class="gen-btn" id="genBtn">生成</button>

    <!-- 次要参数和图片输入放在主要创作项之后 -->
    <div class="upload-zone" id="uploadZone" style="display:none">
      <div id="uploadTitle" class="upload-title">上传图片</div>
      <div class="upload-row" id="uploadRow"></div>
    </div>

    <div class="field" id="modelField">
      <div class="field-label">模型 <span class="muted">基础模型随模式自动切换</span></div>
      <div class="cards2" id="modelCards">
        <button data-v="lora" class="active"><b>MiniMax-H3 + LoRA</b><small>Turbo 加速 · 默认 6 步</small></button>
        <button data-v="standard"><b>标准 MiniMax-H3</b><small>20 步 · 质量优先</small></button>
      </div>
      <div class="subfield" id="loraField">
        <div class="field-label">LoRA 选择</div>
        <div class="cards2" id="loraCards">
          <button data-v="ckpt850" class="active"><b>Turbo ckpt850</b><small>EMA 权重</small></button>
          <button data-v="v4step600"><b>v4-step600</b><small>4 步 · 推荐</small></button>
        </div>
      </div>
    </div>

    <div class="field" id="stepsField">
      <div class="field-label">步数 <span id="stepsVal">6</span> <span class="muted">4~20，步多质量高但更慢</span></div>
      <input type="range" id="steps" min="4" max="20" step="1" value="6">
    </div>

    <div class="compact-pair" id="seedStrengthPair">
      <div class="compact-field" id="loraStrengthField">
        <div class="compact-label"><span>LoRA 强度</span><b id="loraStrengthVal">1.00</b></div>
        <input type="range" id="loraStrength" min="0" max="1.5" step="0.05" value="1">
      </div>
      <div class="compact-field" id="seedField">
        <div class="compact-label"><span>种子</span><small>留空随机</small></div>
        <input type="text" id="seed" placeholder="随机">
      </div>
    </div>

  </aside>

  <!-- 长片拼接编辑器 -->
  <aside class="panel stitch-panel" id="stitchPanel" style="display:none">
    <div class="stitch-heading">
      <b>长片拼接</b>
      <span>从右侧拖入视频，拖动片段可排序</span>
    </div>
    <div class="field">
      <div class="field-label">长片标题</div>
      <input type="text" id="longfilmTitle" maxlength="120" placeholder="例如：敦煌飞天舞蹈短片">
    </div>
    <div class="field">
      <div class="field-label">简介</div>
      <textarea id="longfilmIntro" rows="4" maxlength="1000" placeholder="简单介绍这部长片的内容"></textarea>
    </div>
    <div class="stitch-drop" id="stitchDrop">
      <b>把右侧视频卡片拖到这里</b>
      <span>也可点击卡片下方“＋拼接” · 至少 2 个片段</span>
    </div>
    <div class="stitch-list" id="stitchList"></div>
    <div class="stitch-summary" id="stitchSummary">尚未选择片段</div>
    <button class="gen-btn" id="stitchBtn">合成长片</button>
  </aside>

  <!-- 任务卡片区 -->
  <main class="jobs-area" id="jobsArea">
    <div class="jobs-head">
      <div class="jobs-tabs">
        <button data-st="active">进行中</button>
        <button class="active" data-st="done">已完成</button>
        <button data-st="longfilm">长片</button>
        <button data-st="failed">失败</button>
        <button data-st="canceled">已取消</button>
      </div>
      <div class="jobs-tools" id="doneFilters" hidden>
        <label class="search-box">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
          <input id="doneSearch" type="search" placeholder="搜索提示词、任务 ID">
        </label>
        <select id="doneMedia" aria-label="作品类型">
          <option value="">全部类型</option>
          <option value="video">视频</option>
          <option value="image">图片</option>
        </select>
        <select id="doneAspect" aria-label="画面比例">
          <option value="">全部比例</option>
          <option value="16:9">16:9</option>
          <option value="9:16">9:16</option>
          <option value="4:3">4:3</option>
          <option value="3:4">3:4</option>
          <option value="1:1">1:1</option>
        </select>
        <select id="doneDuration" aria-label="作品时长">
          <option value="">全部时长</option>
          <option value="5">5 秒</option>
          <option value="6">6 秒</option>
          <option value="7">7 秒</option>
          <option value="8">8 秒</option>
          <option value="9">9 秒</option>
          <option value="10">10 秒</option>
          <option value="11">11 秒</option>
          <option value="12">12 秒</option>
          <option value="13">13 秒</option>
          <option value="14">14 秒</option>
          <option value="15">15 秒</option>
        </select>
        <button class="filter-reset" id="doneFilterReset">重置</button>
      </div>
    </div>
    <div class="jobs-grid" id="jobsGrid"></div>
    <div class="jobs-pagination" id="jobsPagination" hidden></div>
  </main>

  <!-- 硬件参数页 -->
  <main class="system-page" id="systemPage" style="display:none">
    <div class="sys-head">
      <div>
        <div class="sys-title">本机硬件参数</div>
        <div class="sys-sub" id="sysSub">读取中…</div>
      </div>
      <button class="sys-refresh" id="sysRefresh">刷新</button>
    </div>
    <div class="sys-grid" id="sysGrid"></div>
  </main>
</div>

<div class="prompt-modal" id="promptModal" hidden>
  <div class="prompt-dialog" role="dialog" aria-modal="true" aria-labelledby="promptModalTitle">
    <div class="prompt-dialog-head">
      <b id="promptModalTitle">完整提示词</b>
      <button id="promptModalClose" aria-label="关闭">×</button>
    </div>
    <textarea id="promptModalText" readonly></textarea>
    <div class="prompt-dialog-actions">
      <button onclick="document.getElementById('promptModalClose').click()">关闭</button>
      <button class="primary" id="promptCopy">复制提示词</button>
    </div>
  </div>
</div>

<script src="/static/app.js?v=compact-seed1"></script>
</body>
</html>
